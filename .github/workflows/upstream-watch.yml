name: Chromium güvenlik sürümü izlemesi

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Yeni sürüm ve sabit kaynak kimliklerini denetle
        run: python scripts/check-upstream --network --format json

# Yeni sürümde çıkış kodu 3 işi başarısız yapar; kilit/yama kendiliğinden değiştirilmez.
# Zamanlanmış GitHub işleri gecikebilir; bu tek başına iki saatlik SLA değildir.
